<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lab DOM</title>
</head>
<body>
    <h1 id="titulo">Mi primera página dinámica</h1>
    <ul id="lista"></ul>

    <button id="saludar" type="button">Saludar</button>

    <ul id="tareas">
        <li><span class="texto">Estudiar el DOM</span><button class="borrar">x</button></li>
        <li><span class="texto">Practicar eventos</span><button class="borrar">x</button></li>
        <li><span class="texto">Hacer la tarea</span><button class="borrar">x</button></li>
    </ul>

    <form id="registro" novalidate>
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" required aria-describedby="correo-error">
        <p id="correo-error" class="error" aria-live="polite"></p>

        <label for="cedula">Cédula</label>
        <input id="cedula" name="cedula" required pattern="([1-9]|1[0-3]|PE|E|N)-\d{1,4}-\d{1,6}" placeholder="8-123-4567" aria-describedby="cedula-error">
        <p id="cedula-error" class="error" aria-live="polite"></p>
        <button type="submit">Enviar</button>
    </form>

  <script src="app.js" defer></script>
</body>
</html>
